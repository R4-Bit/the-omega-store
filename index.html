<div class="products">
  <article class="product-card">
    <div class="product-image">
      <img src="standoff.png" alt="Standoff Original T-shirt design" />
    </div>

    <div class="product-info">
      <div class="product-topline">
        <div class="product-name">Standoff Original</div>
        <div class="price">$29</div>
      </div>

      <p class="product-description">
        Original character artwork printed on a soft everyday T-shirt.
      </p>

      <label class="option-label">Color</label>
      <div class="swatches">
        <button class="swatch black selected" aria-label="Black"></button>
        <button class="swatch white" aria-label="White"></button>
        <button class="swatch sand" aria-label="Sand"></button>
        <button class="swatch navy" aria-label="Navy"></button>
      </div>

      <label class="option-label">Size</label>
      <div class="sizes">
        <button class="size">S</button>
        <button class="size selected">M</button>
        <button class="size">L</button>
        <button class="size">XL</button>
        <button class="size">XXL</button>
      </div>

      <button class="add-button" onclick="addToCart()">
        Add to cart
      </button>
    </div>
  </article>
